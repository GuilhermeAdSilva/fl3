spring:
  application:
    name: flapi
  datasource:
    url: jdbc:postgresql://localhost:5432/fl
    username: postgres
    password: 123456
    #password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081